<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TV Remote</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f0f0f; color: #fff; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .remote { background: #1c1c1e; width: 100%; max-width: 370px; border-radius: 28px; padding: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #30d158; font-weight: bold; }
    input.text { color: #fff; font-weight: normal; width: 100%; margin-bottom: 10px; }
    button { flex: 1; padding: 12px; border-radius: 12px; border: none; background: #2c2c2e; color: #fff; font-weight: bold; cursor: pointer; }
    .home { background: #30d158; color: #000; }
    .power { background: #ff3b30; color: #fff; flex: 0 0 48px; }
    .yt { background: #cc0000; }
    .nf { background: #b81d24; }
    .pv { background: #0088cc; }
    .status { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="remote">
    <div class="row">
      <button class="home" onclick="sendCmd('home')">Home</button>
      <button onclick="testConn()">Test</button>
      <button class="power" onclick="sendCmd('quit')">Off</button>
    </div>

    <input id="pcAddr" placeholder="192.168.1.50:5050" />

    <div class="row">
      <button class="yt" onclick="sendCmd('launch_app', false, 'youtube')">YouTube</button>
      <button class="nf" onclick="sendCmd('launch_app', false, 'netflix')">Netflix</button>
      <button class="pv" onclick="sendCmd('launch_app', false, 'prime')">Prime</button>
    </div>

    <input id="queryBox" class="text" placeholder="YouTube URL or search..." />
    <div class="row">
      <button class="yt" onclick="sendCmd('load_url', true)">Play Link</button>
      <button onclick="sendCmd('search', true)">Search</button>
    </div>

    <div class="row">
      <button onclick="sendCmd('play_pause')">Play/Pause</button>
      <button onclick="sendCmd('mute')">Mute</button>
    </div>
    <div class="row">
      <button onclick="sendCmd('vol_down')">Vol -</button>
      <button onclick="sendCmd('vol_up')">Vol +</button>
    </div>

    <div class="status" id="status">Enter PC IP:5050 and tap Test</div>
  </div>

  <script>
    const addrEl = document.getElementById('pcAddr');
    const statusEl = document.getElementById('status');
    addrEl.value = localStorage.getItem('tv_addr') || '';
    addrEl.addEventListener('change', () => localStorage.setItem('tv_addr', addrEl.value.trim()));

    function baseUrl() {
      let raw = addrEl.value.trim();
      if (!raw) return '';
      if (!raw.startsWith('http://') && !raw.startsWith('https://')) {
        raw = 'http://' + raw;
      }
      return raw.replace(/\/+$/, '');
    }

    async function testConn() {
      const url = baseUrl();
      if (!url) return statusEl.textContent = 'Enter PC IP:5050 first';
      statusEl.textContent = 'Testing ' + url + '...';
      try {
        const r = await fetch(url + '/ping');
        statusEl.textContent = r.ok ? 'Connected to PC!' : 'HTTP ' + r.status;
      } catch (e) {
        statusEl.textContent = 'Failed: ' + e.message + ' (HTTPS->HTTP block or firewall)';
      }
    }

    async function sendCmd(action, useBox = false, val = '') {
      const url = baseUrl();
      if (!url) return statusEl.textContent = 'Enter PC IP:5050 first';
      const value = useBox ? document.getElementById('queryBox').value : val;
      try {
        const r = await fetch(url + '/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, value })
        });
        statusEl.textContent = r.ok ? 'Sent: ' + action : 'Error ' + r.status;
        if (r.ok && useBox) document.getElementById('queryBox').value = '';
      } catch (e) {
        statusEl.textContent = 'Blocked/Offline: ' + e.message;
      }
    }
  </script>
</body>
</html>
